{% extends "base.html" %}

{% block content %}
<body>
    <h1>Hi, {{ current_user.login }}!</h1>
    <b>Peoples posts that you are following:</b>
    {% for post in posts %}
        <table>
            <tr valign="top">
                <td><img src="{{ user.avatar(30) }}" class="rounded-circle"></td>
                <td><br>{{ post.body }}</td>
                <td><br>{{ post.timestamp }}</td>
            </tr>
        </table>
    {% endfor %}
</body>
{% endblock %}
