{% extends "base.html" %}

{% block content %}
<body>
    <h1>Hi, {{ current_user.login }}!</h1>
    <b>Peoples posts that you are following:</b>
    {% for post in posts %}
        <div style="height: 30%; margin: 2%; background-color:#f5f5f5">
            <b>{{ post.body }}</b>
            <p>{{ post.timestamp }}</p>
        </div>
    {% endfor %}
</body>
{% endblock %}
